###############################################################################
#
# Nextcloud-Gr Project
#
# File:
#   compose/30-nextcloud-fpm.yml
#
# Description:
#   Official Nextcloud PHP-FPM image. Port 9000 stays on the Docker
#   network. Nginx is the only published service.
#
#   No custom entrypoint and no custom command: the image CMD is
#   php-fpm, so docker-entrypoint.sh may install or upgrade this
#   container. NEXTCLOUD_UPDATE is left unset. Setting it to 0 would
#   not disable that path, because the entrypoint also enters it for
#   php-fpm. deploy.sh refuses to start a tag that differs from the
#   recorded installed version. Cron uses the same image with command
#   /cron.sh and NEXTCLOUD_UPDATE=0, so it does not upgrade.
#
#   NC_setup_create_db_user=false keeps the installer on POSTGRES_USER.
#   Otherwise a superuser login makes Nextcloud create oc_admin, and
#   that role cannot read tables owned by the original account.
#
###############################################################################

services:
  nextcloud:
    image: ${NEXTCLOUD_IMAGE}:${NEXTCLOUD_TAG}

    container_name: nextcloud-gr-app

    hostname: nextcloud-gr-app

    restart: unless-stopped

    security_opt:
      - no-new-privileges:true

    stop_grace_period: 60s

    environment:
      POSTGRES_HOST: postgresql
      POSTGRES_DB: ${PG_DB}
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASS}
      NC_setup_create_db_user: "false"
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD}
      NEXTCLOUD_DATA_DIR: /var/www/html/data
      NEXTCLOUD_TRUSTED_DOMAINS: ${NEXTCLOUD_TRUSTED_DOMAINS}
      REDIS_HOST: redis
      REDIS_HOST_PORT: "6379"
      REDIS_HOST_PASSWORD: ${REDIS_PASSWORD}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES}
      OVERWRITEPROTOCOL: ${OVERWRITEPROTOCOL}
      OVERWRITEHOST: ${OVERWRITEHOST}
      OVERWRITECLIURL: ${OVERWRITECLIURL}
      FORWARDED_FOR_HEADERS: ${FORWARDED_FOR_HEADERS}
      PHP_MEMORY_LIMIT: ${PHP_MEMORY_LIMIT}
      PHP_UPLOAD_LIMIT: ${PHP_UPLOAD_LIMIT}
      PHP_OPCACHE_MEMORY_CONSUMPTION: ${PHP_OPCACHE_MEMORY_CONSUMPTION}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_SECURE: ${SMTP_SECURE}
      SMTP_NAME: ${SMTP_NAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS}
      MAIL_DOMAIN: ${MAIL_DOMAIN}

    volumes:
      # Code, config, custom_apps and themes live in the HTML directory.
      # The second mount replaces only /var/www/html/data. It is a
      # different host directory, not a second copy of config.
      - ${NEXTCLOUD_HTML_HOST_DIR}:/var/www/html
      - ${NEXTCLOUD_DATA_HOST_DIR}:/var/www/html/data
      - ../configs/nextcloud/hooks/10-apcu.sh:/docker-entrypoint-hooks.d/post-installation/10-apcu.sh:ro
      - ../configs/nextcloud/hooks/10-apcu.sh:/docker-entrypoint-hooks.d/post-upgrade/10-apcu.sh:ro

    depends_on:
      postgresql:
        condition: service_healthy

      redis:
        condition: service_healthy

    healthcheck:
      test:
        - CMD-SHELL
        - >-
          php -r 'exit(@fsockopen("127.0.0.1", 9000) ? 0 : 1);'
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 180s

    networks:
      - nextcloud-gr

    logging:
      driver: json-file

      options:
        max-size: ${LOG_MAX_SIZE}
        max-file: "${LOG_MAX_FILES}"
