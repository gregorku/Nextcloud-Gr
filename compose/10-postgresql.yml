###############################################################################
#
# Nextcloud-Gr Project
#
# File:
#   compose/10-postgresql.yml
#
# Description:
#   PostgreSQL 18 for a new Nextcloud database. No host port is
#   published.
#
#   Image pin: docker.io/library/postgres:18.6
#   Checked on 2026-10-20 against Docker Hub and the official image
#   notes. PGDATA is /var/lib/postgresql/18/docker. The volume is
#   /var/lib/postgresql, not /var/lib/postgresql/data.
#   The Debian image creates the OS account postgres as uid 999.
#   initdb --username is POSTGRES_USER. PostgreSQL 16 and newer keep
#   SUPERUSER on that role (OID 10) permanently. It is therefore
#   nc_bootstrap, not PG_USER. deploy.sh creates PG_USER without
#   SUPERUSER and makes it the owner Nextcloud and cron log in as.
#   An existing cluster whose OID 10 is still PG_USER is renamed to
#   nc_bootstrap; the attribute is not removed.
#
###############################################################################

services:

  postgresql:

    image: ${POSTGRES_IMAGE}

    container_name: nextcloud-gr-postgresql

    hostname: nextcloud-gr-postgresql

    restart: unless-stopped

    security_opt:
      - no-new-privileges:true

    environment:

      POSTGRES_DB: ${PG_DB}
      POSTGRES_USER: nc_bootstrap
      POSTGRES_PASSWORD: ${PG_PASS}
      PGDATA: /var/lib/postgresql/18/docker
      POSTGRES_INITDB_ARGS: --data-checksums

    volumes:

      - ${POSTGRESQL_HOST_DIR}:/var/lib/postgresql

    healthcheck:

      test:
        - CMD-SHELL
        - pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER} || pg_isready -d $${POSTGRES_DB}

      interval: 30s

      timeout: 5s

      retries: 5

      start_period: 40s

    networks:

      - nextcloud-gr

    logging:

      driver: json-file

      options:
        max-size: ${LOG_MAX_SIZE}
        max-file: "${LOG_MAX_FILES}"
