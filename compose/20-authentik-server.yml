###############################################################################
#
# Authentik-netcup Project
#
# File:
#   compose/20-authentik-server.yml
#
# Description:
#   authentik server, including the embedded outpost on port 9000.
#
#   Published only on the Incus container address:
#     ${AUTHENTIK_HOST_IP}:${AUTHENTIK_HTTP_PORT}:9000
#
#   Port 9443 is not published. Infrastructure-netcup Traefik terminates
#   TLS for https://auth.serveftp.org and forwards HTTP to
#   http://10.10.10.100:9000.
#
#   Do not mount /etc/localtime into this container. Upstream documents
#   that a host timezone mount breaks OAuth and SAML.
#
###############################################################################

services:

  server:

    image: ${AUTHENTIK_IMAGE}:${AUTHENTIK_TAG}

    container_name: authentik-server

    hostname: authentik-server

    command: server

    restart: unless-stopped

    shm_size: 512mb

    security_opt:
      - no-new-privileges:true

    environment:

      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}

      AUTHENTIK_POSTGRESQL__HOST: postgresql
      AUTHENTIK_POSTGRESQL__PORT: "5432"
      AUTHENTIK_POSTGRESQL__NAME: ${PG_DB}
      AUTHENTIK_POSTGRESQL__USER: ${PG_USER}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${PG_PASS}

      #
      # Matches authentik/lib/default.yml for 2026.8.3 (sslmode: disable).
      # The PostgreSQL container does not serve TLS.
      #
      AUTHENTIK_POSTGRESQL__SSLMODE: ${AUTHENTIK_POSTGRESQL__SSLMODE}

      AUTHENTIK_ERROR_REPORTING__ENABLED: ${AUTHENTIK_ERROR_REPORTING__ENABLED}
      AUTHENTIK_OUTPOSTS__DISCOVER: ${AUTHENTIK_OUTPOSTS__DISCOVER}
      AUTHENTIK_LISTEN__TRUSTED_PROXY_CIDRS: ${AUTHENTIK_LISTEN__TRUSTED_PROXY_CIDRS}

      AUTHENTIK_EMAIL__HOST: ${AUTHENTIK_EMAIL__HOST}
      AUTHENTIK_EMAIL__PORT: ${AUTHENTIK_EMAIL__PORT}
      AUTHENTIK_EMAIL__USERNAME: ${AUTHENTIK_EMAIL__USERNAME}
      AUTHENTIK_EMAIL__PASSWORD: ${AUTHENTIK_EMAIL__PASSWORD}
      AUTHENTIK_EMAIL__USE_TLS: ${AUTHENTIK_EMAIL__USE_TLS}
      AUTHENTIK_EMAIL__USE_SSL: ${AUTHENTIK_EMAIL__USE_SSL}
      AUTHENTIK_EMAIL__TIMEOUT: ${AUTHENTIK_EMAIL__TIMEOUT}
      AUTHENTIK_EMAIL__FROM: ${AUTHENTIK_EMAIL__FROM}

    ports:

      - "${AUTHENTIK_HOST_IP}:${AUTHENTIK_HTTP_PORT}:9000"

    volumes:

      #
      # File storage. The image default is /data
      # (AUTHENTIK_STORAGE__FILE__PATH).
      #
      - ${DATA_DIR}/authentik/data:/data

      #
      # Custom templates. Packaged blueprints stay in the image at
      # /blueprints and are not hidden by an empty mount.
      #
      - ${DATA_DIR}/authentik/templates:/templates

    depends_on:

      postgresql:
        condition: service_healthy

    healthcheck:

      test:
        - CMD
        - ak
        - healthcheck

      interval: 30s

      timeout: 30s

      retries: 3

      start_period: 120s

    networks:

      authentik-netcup:
        ipv4_address: ${IP_AUTHENTIK_SERVER}

    logging:

      driver: json-file

      options:
        max-size: ${LOG_MAX_SIZE}
        max-file: "${LOG_MAX_FILES}"
