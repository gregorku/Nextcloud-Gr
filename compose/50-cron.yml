###############################################################################
#
# Nextcloud-Gr Project
#
# File:
#   compose/50-cron.yml
#
# Description:
#   Same Nextcloud image and volumes as PHP-FPM. The image entrypoint
#   stays in place and the command is /cron.sh. Official
#   docker-entrypoint.sh runs install or upgrade only for php-fpm
#   (and apache) or when NEXTCLOUD_UPDATE=1. NEXTCLOUD_UPDATE=0 keeps
#   this command from doing either. Checked against
#   nextcloud/docker docker-entrypoint.sh on 2026-10-20.
#
###############################################################################

services:
  cron:
    image: ${NEXTCLOUD_IMAGE}:${NEXTCLOUD_TAG}

    container_name: nextcloud-gr-cron

    hostname: nextcloud-gr-cron

    restart: unless-stopped

    security_opt:
      - no-new-privileges:true

    command:
      - /cron.sh

    environment:
      POSTGRES_HOST: postgresql
      POSTGRES_DB: ${PG_DB}
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASS}
      NC_setup_create_db_user: "false"
      NEXTCLOUD_DATA_DIR: /var/www/html/data
      REDIS_HOST: redis
      REDIS_HOST_PORT: "6379"
      REDIS_HOST_PASSWORD: ${REDIS_PASSWORD}
      PHP_MEMORY_LIMIT: ${PHP_MEMORY_LIMIT}
      PHP_UPLOAD_LIMIT: ${PHP_UPLOAD_LIMIT}
      PHP_OPCACHE_MEMORY_CONSUMPTION: ${PHP_OPCACHE_MEMORY_CONSUMPTION}
      NEXTCLOUD_UPDATE: "0"
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_SECURE: ${SMTP_SECURE}
      SMTP_NAME: ${SMTP_NAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS}
      MAIL_DOMAIN: ${MAIL_DOMAIN}

    volumes:
      - ${NEXTCLOUD_HTML_HOST_DIR}:/var/www/html
      - ${NEXTCLOUD_DATA_HOST_DIR}:/var/www/html/data

    depends_on:
      nextcloud:
        condition: service_healthy

      postgresql:
        condition: service_healthy

      redis:
        condition: service_healthy

    # Compose interpolates $name in this file before the container
    # runs. $cmdline and $status were therefore empty: Compose warned
    # that those variables were unset, grep read an empty string, and
    # the container stayed unhealthy. This test has no shell variables.
    # /cron.sh does `exec busybox crond -f -L /dev/stdout`, so PID 1 is
    # crond, not the shell and not cron.sh. The image has no ps.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          tr '\0' ' ' < /proc/1/cmdline
          | grep -F -q 'busybox crond'
          && tr '\0' ' ' < /proc/1/cmdline
          | grep -F -v -q 'cron.sh'
          && su -s /bin/bash www-data -c 'php /var/www/html/occ status'
          | grep -Eq 'installed:[[:space:]]*true'

      interval: 30s

      timeout: 20s

      retries: 5

      start_period: 60s

    networks:
      - nextcloud-gr

    logging:
      driver: json-file

      options:
        max-size: ${LOG_MAX_SIZE}
        max-file: "${LOG_MAX_FILES}"
