###############################################################################
#
# Nextcloud-Gr Project
#
# File:
#   compose/50-cron.yml
#
# Description:
#   Same Nextcloud image and volumes as PHP-FPM. The image entrypoint
#   stays in place and the command is /cron.sh. Official
#   docker-entrypoint.sh runs install or upgrade only for php-fpm
#   (and apache) or when NEXTCLOUD_UPDATE=1. NEXTCLOUD_UPDATE=0 keeps
#   this command from doing either. Checked against
#   nextcloud/docker docker-entrypoint.sh on 2026-10-20.
#
###############################################################################

services:

  cron:

    image: ${NEXTCLOUD_IMAGE}:${NEXTCLOUD_TAG}

    container_name: nextcloud-gr-cron

    hostname: nextcloud-gr-cron

    restart: unless-stopped

    security_opt:
      - no-new-privileges:true

    command:
      - /cron.sh

    environment:

      POSTGRES_HOST: postgresql
      POSTGRES_DB: ${PG_DB}
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASS}
      NEXTCLOUD_DATA_DIR: /var/www/html/data
      REDIS_HOST: redis
      REDIS_HOST_PORT: "6379"
      REDIS_HOST_PASSWORD: ${REDIS_PASSWORD}
      PHP_MEMORY_LIMIT: ${PHP_MEMORY_LIMIT}
      PHP_UPLOAD_LIMIT: ${PHP_UPLOAD_LIMIT}
      PHP_OPCACHE_MEMORY_CONSUMPTION: ${PHP_OPCACHE_MEMORY_CONSUMPTION}
      NEXTCLOUD_UPDATE: "0"
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_SECURE: ${SMTP_SECURE}
      SMTP_NAME: ${SMTP_NAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS}
      MAIL_DOMAIN: ${MAIL_DOMAIN}

    volumes:

      - ${NEXTCLOUD_HTML_HOST_DIR}:/var/www/html
      - ${NEXTCLOUD_DATA_HOST_DIR}:/var/www/html/data

    depends_on:

      nextcloud:
        condition: service_healthy

      postgresql:
        condition: service_healthy

      redis:
        condition: service_healthy

    healthcheck:

      test:
        - CMD-SHELL
        - >-
          ps -o args= 1 | grep -q cron.sh
          && su -s /bin/bash www-data -c 'php /var/www/html/occ status'
          | grep -Eq 'installed:[[:space:]]*true'

      interval: 30s

      timeout: 20s

      retries: 5

      start_period: 60s

    networks:

      - nextcloud-gr

    logging:

      driver: json-file

      options:
        max-size: ${LOG_MAX_SIZE}
        max-file: "${LOG_MAX_FILES}"
