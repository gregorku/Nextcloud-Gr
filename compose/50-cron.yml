###############################################################################
#
# Nextcloud-Gr Project
#
# File:
#   compose/50-cron.yml
#
# Description:
#   /cron.sh from the same Nextcloud image and the same volumes as the
#   PHP-FPM service. NEXTCLOUD_UPDATE stays unset, so this custom
#   entrypoint does not run the image upgrade.
#
###############################################################################

services:

  cron:

    image: ${NEXTCLOUD_IMAGE}:${NEXTCLOUD_TAG}

    container_name: nextcloud-gr-cron

    hostname: nextcloud-gr-cron

    restart: unless-stopped

    security_opt:
      - no-new-privileges:true

    entrypoint: /cron.sh

    environment:

      POSTGRES_HOST: postgresql
      POSTGRES_DB: ${PG_DB}
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASS}
      NEXTCLOUD_DATA_DIR: /var/www/html/data
      REDIS_HOST: redis
      REDIS_HOST_PORT: "6379"
      REDIS_HOST_PASSWORD: ${REDIS_PASSWORD}
      PHP_MEMORY_LIMIT: ${PHP_MEMORY_LIMIT}
      PHP_UPLOAD_LIMIT: ${PHP_UPLOAD_LIMIT}
      PHP_OPCACHE_MEMORY_CONSUMPTION: ${PHP_OPCACHE_MEMORY_CONSUMPTION}
      NEXTCLOUD_UPDATE: "0"
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_SECURE: ${SMTP_SECURE}
      SMTP_NAME: ${SMTP_NAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS}
      MAIL_DOMAIN: ${MAIL_DOMAIN}

    volumes:

      - ${NEXTCLOUD_HTML_HOST_DIR}:/var/www/html
      - ${NEXTCLOUD_DATA_HOST_DIR}:/var/www/html/data

    depends_on:

      nextcloud:
        condition: service_healthy

      postgresql:
        condition: service_healthy

      redis:
        condition: service_healthy

    healthcheck:

      test:
        - CMD-SHELL
        - ps -o args= 1 | grep -q cron.sh

      interval: 60s

      timeout: 5s

      retries: 3

      start_period: 30s

    networks:

      - nextcloud-gr

    logging:

      driver: json-file

      options:
        max-size: ${LOG_MAX_SIZE}
        max-file: "${LOG_MAX_FILES}"
