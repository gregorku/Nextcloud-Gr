###############################################################################
#
# Nextcloud-Gr Project
#
# File:
#   compose/40-nginx.yml
#
# Description:
#   Nginx in front of PHP-FPM. The only published port is the private
#   HTTP listener. TLS is not configured here.
#
###############################################################################

services:
  nginx:
    image: ${NGINX_IMAGE}

    container_name: nextcloud-gr-nginx

    hostname: nextcloud-gr-nginx

    restart: unless-stopped

    security_opt:
      - no-new-privileges:true

    ports:
      - "${NEXTCLOUD_BACKEND_BIND}:${NEXTCLOUD_BACKEND_PORT}:80"

    volumes:
      # Server snippet. It replaces the image default server inside
      # conf.d so `upstream` stays in the http context. Paths are
      # relative to this compose file.
      - ../configs/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../runtime/real-ip.conf:/etc/nginx/real-ip.conf:ro
      - ${NEXTCLOUD_HTML_HOST_DIR}:/var/www/html:ro
      - ${NEXTCLOUD_DATA_HOST_DIR}:/var/www/html/data:ro

    depends_on:
      nextcloud:
        condition: service_healthy

    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O - http://127.0.0.1/status.php | grep -q '"installed":true'

      interval: 30s

      timeout: 5s

      retries: 5

      start_period: 30s

    networks:
      - nextcloud-gr

    logging:
      driver: json-file

      options:
        max-size: ${LOG_MAX_SIZE}
        max-file: "${LOG_MAX_FILES}"
